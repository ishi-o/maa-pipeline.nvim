name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stylecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p release && npm pack --pack-destination release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/maa-pipeline.nvim-*.tgz
